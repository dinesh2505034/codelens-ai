<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Top-Right Antenna / Beam -->
  <line x1="58" y1="39" x2="72" y2="25" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" />

  <!-- Top Blue Signal Dash -->
  <rect x="76" y="22.5" width="9" height="5" rx="2.5" fill="#38BDF8" />

  <!-- Bottom Blue Signal Dash -->
  <rect x="72" y="34" width="13" height="5.5" rx="2.75" fill="#38BDF8" />

  <!-- Handle Shadow (Subtle) -->
  <path d="M62 67 L79 84" stroke="rgba(0,0,0,0.25)" stroke-width="12" stroke-linecap="round" />

  <!-- Handle (White Pill) -->
  <line x1="60" y1="65" x2="77" y2="82" stroke="currentColor" stroke-width="9.5" stroke-linecap="round" />

  <!-- Outer Lens Ring (White) -->
  <circle cx="42" cy="52" r="21" stroke="currentColor" stroke-width="6.5" />

  <!-- Inner Cyan / Blue Eye Iris -->
  <circle cx="42" cy="52" r="10.5" stroke="#38BDF8" stroke-width="5.5" fill="none" />
</svg>
