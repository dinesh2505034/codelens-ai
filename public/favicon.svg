<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded App Tile Background -->
  <rect width="100" height="100" rx="22" fill="#0D111E" />

  <!-- Top-Right Scanning Beam / Antenna -->
  <line x1="58" y1="39" x2="72" y2="25" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- Top Cyan Signal Dash -->
  <rect x="75" y="22" width="10" height="5.5" rx="2.75" fill="#38BDF8" />

  <!-- Bottom Cyan Signal Dash -->
  <rect x="71" y="34" width="15" height="6" rx="3" fill="#38BDF8" />

  <!-- Handle Shadow -->
  <line x1="62" y1="67" x2="80" y2="85" stroke="rgba(0,0,0,0.4)" stroke-width="11" stroke-linecap="round" />

  <!-- Main Lens Handle -->
  <line x1="60" y1="65" x2="78" y2="83" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />

  <!-- Outer White Lens Ring -->
  <circle cx="42" cy="52" r="21" stroke="#FFFFFF" stroke-width="7" />

  <!-- Inner Cyan / Blue Focal Iris -->
  <circle cx="42" cy="52" r="10.5" stroke="#38BDF8" stroke-width="6" fill="none" />
</svg>
